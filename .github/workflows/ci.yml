name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# All third-party actions are pinned to commit SHAs. To upgrade a
# pinned action, look up the new SHA (e.g. via
# https://github.com/<owner>/<repo>/git/refs/tags/<tag>) and update
# both the SHA and the version comment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.0
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install 'ruff>=0.15,<1'

      - name: Ruff check
        run: ruff check app/ scripts/

      - name: Ruff format check
        run: ruff format --check app/ scripts/

  type-check:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies (locked)
        # TabFM and profiling require incompatible typeguard major versions, so
        # the research-model extras are validated in their own environments.
        run: uv sync --locked --group dev --extra validation --extra profiling --extra benchmark --extra experiment --extra kaggle --extra uci --extra flaml --extra colab --extra providers --extra explain --extra serve

      - name: Run Pyright
        run: uv run --no-sync pyright app/

  security-bandit:
    name: Security (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies (locked)
        run: uv sync --locked --group security --group dev

      - name: Run Bandit
        run: uv run --no-sync bandit -r app/ -c pyproject.toml

      - name: Run pip-audit
        run: uv run --no-sync pip-audit || true
